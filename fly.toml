# Fly.io config for the outdeals API.
#
# Run `fly deploy` from the repository root — the Dockerfile copies both
# shared/ and server/, so the build context has to be the root, not server/.
#
# Change `app` to the name you registered, then update SITE_URL / API_BASE_URL /
# ALLOWED_ORIGINS below to match your real URLs. See DEPLOY.md.

app = "outdeals-api"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

# One machine, one volume, one SQLite file. `fly launch` likes to create two
# machines; do not let it. A volume attaches to a single machine, and SQLite
# takes a single writer — a second machine would either fail to start or, worse,
# serve a different board.
[deploy]
  strategy = "immediate"

[[mounts]]
  source = "outdeals_data"
  destination = "/data"

[env]
  PORT = "8787"
  DB_PATH = "/data/outdeals.db"

  # Where payers are sent back to after checkout — your Pages URL.
  SITE_URL = "https://iansells2025.github.io/github-pages/deals/index.html"
  # This API's own public origin, used to build Stripe's return URLs.
  API_BASE_URL = "https://outdeals-api.fly.dev"
  # Only your board may call the API from a browser.
  ALLOWED_ORIGINS = "https://iansells2025.github.io"

  # Fly terminates TLS in front of the app, so read the real client IP from
  # the forwarded header rather than rate-limiting the proxy.
  TRUST_PROXY = "1"

  # Fill a brand-new database with the demo listings. Set to 0 before a real
  # launch so the board starts empty.
  SEED_ON_EMPTY = "1"

  # Check listing links every 6 hours. Flags only definitive 404/410s for review.
  CHECK_LINKS_INTERVAL_MIN = "360"

# Secrets are NOT set here — they would be committed. Use:
#   fly secrets set STRIPE_SECRET_KEY=... STRIPE_WEBHOOK_SECRET=... ADMIN_TOKEN=...

[http_service]
  internal_port = 8787
  force_https = true
  auto_start_machines = true
  # Keep the machine up. A stopped machine still wakes on an incoming webhook,
  # but the periodic link check and pending-bid expiry would never fire.
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
